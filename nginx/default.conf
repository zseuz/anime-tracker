server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The service worker and manifest must always be revalidated.
  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location = /ngsw.json      { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }

  # Hashed assets can be cached for a long time.
  location ~* \.(?:js|css|png|ico|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths go to index.html.
  location / { try_files $uri $uri/ /index.html; }
}
